<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonda de marca e site</title>
<style>
  body { margin: 0; font: 1.125rem/1.5 sans-serif; color: #1a1a1a; background: #fff; }
  :focus-visible { outline: 3px solid #1a1a1a; outline-offset: 2px; }
  .pular { display: inline-block; padding: 14px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; }
  header a { display: inline-flex; align-items: center; min-height: 48px; }
  main { padding: 16px; }
  .vaga { background: repeating-linear-gradient(135deg, #f5f5f5 0 14px, #eeeeee 14px 28px); padding: 24px; margin-top: 16px; }
</style>
</head>
<body>
<a class="pular" href="#c">Pular para o conteúdo</a>
<header>
  <!-- plantado: logo em SVG com cor fixa, sem versão para alto contraste -->
  <a href="#c"><img src="marca/logo.svg" width="160" height="32" alt="Oficina do Teste"></a>
  <!-- plantado: a mesma ação duas vezes à vista -->
  <a href="#onde">Onde fica</a>
  <a href="#onde">Onde fica</a>
</header>
<main id="c">
  <h1>Sonda de marca e site</h1>
  <p>Texto da página para a medida de contraste, com o bastante para ocupar a linha inteira da tela em qualquer largura que o verificador abra.</p>
  <!-- o texto sobre a listra foi conferido à mão: não entra no aviso -->
  <div class="vaga" data-conferido="a11y-contraste-imagem">Foto da fachada vem aqui</div>
  <h2 id="onde">Onde fica</h2>
  <p>Rua do Exemplo, 100.</p>
</main>
</body>
</html>
